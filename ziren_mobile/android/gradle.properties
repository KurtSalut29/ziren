# ============================================================
# Gradle JVM tuning for a memory-constrained machine (~7 GB RAM).
#
# Why these numbers are low:
#
# `flutter build apk` runs TWO independent JVM/VM workloads that overlap in
# time — the Gradle daemon (plus a separate Kotlin compile daemon) and the
# Dart kernel-snapshot compiler, which Gradle shells out to as
# :app:compileFlutterBuildDebug. Memory the Gradle daemon reserves is memory
# the Dart frontend cannot have.
#
# With the previous -Xmx2g the build failed two different ways depending on
# which workload lost the race:
#   - "Native memory allocation (malloc) failed ... Chunk::new"  (HotSpot JIT)
#   - "runtime/platform/allocation.cc: 30: error: Out of memory" (Dart VM)
#
# Neither is a heap-sizing bug in the usual sense; both are the OS refusing a
# commit because the box was already full. Shrinking Gradle's reservation
# leaves headroom for the Dart step.
#
# If a Gradle-side OutOfMemoryError appears after this change, raise jvmargs
# back in 256m steps rather than jumping to 2g.
#
# 2026-09-04: raised 1024m -> 1280m, one step, per the rule above. Enabling
# core library desugaring for flutter_local_notifications put D8 in the build,
# and D8 rewrites every class in every dependency against the desugared JDK —
# a step that did not exist before and that runs inside the Gradle daemon. At
# 1024m the daemon did not report an OutOfMemoryError; it vanished, and Gradle
# reported "Gradle build daemon disappeared unexpectedly" with a HotSpot crash
# log beside it. Same cause, louder symptom.
#
# 2026-09-14: raised MaxMetaspaceSize 384m -> 640m, one step, per the rule
# above. First-ever `flutter build apk --release` on this project loads R8
# (minifyReleaseWithR8) plus Android Lint (lintVitalAnalyzeRelease) — neither
# runs in a debug build — and both are classloading-heavy JVM tasks that
# hadn't shared a daemon before. 384m produced "R8:
# java.lang.OutOfMemoryError: Metaspace" and a simultaneous lint failure with
# the same cause. -Xmx and ReservedCodeCacheSize were not the ones that
# failed, so they are unchanged.
# ============================================================
org.gradle.jvmargs=-Xmx1280m -XX:MaxMetaspaceSize=640m -XX:ReservedCodeCacheSize=128m -XX:+HeapDumpOnOutOfMemoryError

# The Kotlin plugin forks its own compile daemon. Left unset it inherits
# Gradle's jvmargs and doubles the reservation.
kotlin.daemon.jvmargs=-Xmx640m

# Serial execution. Parallel module builds multiply peak memory by the number
# of workers, which is the opposite of what this machine needs.
org.gradle.parallel=false
org.gradle.workers.max=2

# Stale daemons were accumulating (six java processes were resident before a
# `gradlew --stop`), each holding its full reservation. Expire idle daemons
# after 30 minutes instead of the 3-hour default.
org.gradle.daemon.idletimeout=1800000

android.useAndroidX=true
android.enableJetifier=true
