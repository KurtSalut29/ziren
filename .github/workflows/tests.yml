# Every automated test on every push and pull request (evaluator finding #27).
# The same steps as tools/test-all.ps1, on GitHub's runners.
name: tests

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ziren_backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ziren_backend/requirements.txt
      - run: pip install -r requirements.txt pytest pytest-cov
      # Tests mock Supabase and never touch the network; these only satisfy
      # settings validation at import.
      - run: python -m pytest -q --cov=app --cov-report=term
        env:
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_SERVICE_KEY: test
          SECRET_KEY: test-secret-key-for-ci-only

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ziren_dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ziren_dashboard/package-lock.json
      - run: npm ci
      - run: npx vitest run
      - run: npx tsc --noEmit -p .

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ziren_mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze lib
      - run: flutter test
